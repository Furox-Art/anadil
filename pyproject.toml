[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-python"
version = "0.1.0"
description = "Deterministic multilingual Python keyword transpiler: write Python in your own language."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Furox-Art" }]
keywords = ["python", "transpiler", "localization", "multilingual", "deterministic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Compilers",
]

[project.scripts]
polyglot-python = "polyglot_python.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.urls]
Homepage = "https://github.com/Furox-Art/polyglot-python"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polyglot_python = ["locales.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
