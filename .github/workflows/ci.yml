name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Test
        shell: bash
        run: |
          gate=""
          if [ "$RUNNER_OS" = "Linux" ] && [ "${{ matrix.python }}" = "3.12" ]; then
            gate="--cov-fail-under=100"
          fi
          python -m pytest -q --cov=polyglot_python $gate

  determinism:
    name: determinism ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Translate twice and compare bytes and line counts
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          sources = sorted(pathlib.Path("examples").glob("classify.*"))
          sources += sorted(pathlib.Path("examples").glob("tour.*"))
          for source in sources:
              command = [sys.executable, "-m", "polyglot_python", "translate", str(source)]
              first = subprocess.run(command, capture_output=True, check=True).stdout
              second = subprocess.run(command, capture_output=True, check=True).stdout
              assert first == second, f"nondeterministic: {source}"
              raw = source.read_bytes()
              assert first.count(b"\n") == raw.count(b"\n"), f"line drift: {source}"
          print("determinism: ok")
          PY

  package:
    name: package wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
      - name: Smoke test the installed wheel
        run: |
          /tmp/wheel-venv/bin/polyglot-python check examples/classify.ru
          /tmp/wheel-venv/bin/polyglot-python run examples/classify.tr | tail -n 1 | grep -qx FizzBuzz

  npm:
    name: npm wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the Python package
        run: python -m pip install .
      - name: Smoke test the npm wrapper
        shell: bash
        run: |
          version=$(node -p "require('./npm/package.json').version")
          node npm/bin/polyglot-python.js --version | grep -qx "polyglot-python $version"
          node npm/bin/polyglot-python.js check examples/classify.ru
          node npm/bin/polyglot-python.js run examples/classify.tr | tail -n 1 | grep -qx FizzBuzz
      - name: Check npm package contents
        working-directory: npm
        run: npm pack --dry-run
