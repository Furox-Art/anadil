name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Test
        shell: bash
        run: |
          gate=""
          if [ "$RUNNER_OS" = "Linux" ] && [ "${{ matrix.python }}" = "3.12" ]; then
            gate="--cov-fail-under=100"
          fi
          python -m pytest -q --cov=anadil $gate

  determinism:
    name: determinism ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Translate twice and compare bytes and line counts
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          for source in sorted(pathlib.Path("examples").glob("classify.*")):
              command = [sys.executable, "-m", "anadil", "translate", str(source)]
              first = subprocess.run(command, capture_output=True, check=True).stdout
              second = subprocess.run(command, capture_output=True, check=True).stdout
              assert first == second, f"nondeterministic: {source}"
              raw = source.read_bytes()
              assert first.count(b"\n") == raw.count(b"\n"), f"line drift: {source}"
          print("determinism: ok")
          PY
